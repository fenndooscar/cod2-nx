# ============================================================================
#  COD2 Recomp - executable configuration
#
#  The game reads this file at startup, from its own folder:
#      <.exe folder>\cod2.toml
#
#  The name is not the executable's but the app's ("cod2"), so it works
#  the same next to NFS_Most_Wanted.exe as next to cod2.exe.
#
#  Command-line arguments take precedence over what is here, so things
#  can still be tried with PROBAR_RTV.bat without touching the file.
# ============================================================================


# ----------------------------------------------------------------------------
#  EDRAM emulation path
# ----------------------------------------------------------------------------
#
#  WHAT IT IS
#  The Xbox 360 has no normal render targets: it has 10 MB of embedded
#  memory (the EDRAM) where fixed-function hardware does blending and the
#  depth test. There are two ways to emulate that:
#
#    "rtv"  host render targets, using the GPU normally. Fast.
#    "rov"  the EDRAM is emulated by hand inside the pixel shader, with interlocks
#           that force overlapping pixels to be processed in order. It is
#           more accurate and much slower.
#
#  WHY IT IS SET EXPLICITLY
#  Because the SDK did not choose by performance but by vendor
#  (src/graphics/d3d12/render_target_cache.cpp):
#
#      path_ = vendor == kIntel ? kPixelShaderInterlock : kHostRenderTargets;
#
#  On Intel GPUs, ROV was forced. The reason is dated in the SDK's own
#  comment: an Intel driver bug from April 2021 (a UHD 630) where the
#  "always" stencil comparison did not work. And the comment next to it
#  says "The ROV path is currently much slower generally".
#
#  MEASURED IN THIS PROJECT, on an Intel Iris 540, same spot, no vsync:
#      rov (what the SDK forced)    ~10 fps
#      rtv (this setting)           ~18 fps
#
#  With no visible glitches, so the 2021 bug is no longer in the driver.
#
#  On NVIDIA and AMD "rtv" was already the default, so setting it here
#  changes nothing for them. All this line does is remove a decision
#  made by graphics card brand.
#
#  If it ever looks wrong (ghosting, things that are not cleared, leftovers
#  from the previous frame), try "rov" and compare.
render_target_path_d3d12 = "rtv"


# ----------------------------------------------------------------------------
#  Which renderer draws the game
# ----------------------------------------------------------------------------
#
#  WHAT IT IS
#    "xenos"   ReXGlue's emulated Xbox 360 GPU. It records the game's PM4
#              commands and replays them through the SDK's Vulkan backend.
#    "nativo"  the port's own renderer (app/src/cod2_nativo_*.cpp). It answers
#              the same MMIO registers the game polls, reads the same ring, and
#              draws with its own pipelines and its own EDRAM emulation.
#
#  WHY "nativo" IS THE DEFAULT HERE
#  The emulated path is a dead end for this port and was dropped deliberately:
#  it is the reason the game runs at 5-6 fps in a level on the console, because
#  the EDRAM that made the Xbox 360's resolves and overdraw free is paid for
#  twice on this hardware. No amount of cutting inside that path fits the frame
#  into 33 ms. See README.md item 13.
#
#  HOW TO GO BACK
#  Set it to "xenos" and restart. Both paths are compiled into the same NRO:
#  this line is the whole switch, and it is the escape hatch if the native
#  renderer misbehaves on the console.
#
#  WHAT TO EXPECT FROM "nativo" RIGHT NOW
#  It boots and it draws, identifying each draw's shaders from the ring's own
#  IM_LOAD packets. It is not finished: the game's draw entry is still to be
#  derived, so a patched vertex shader is identified by remembering a pairing
#  rather than by looking it up, and the game-side reductions (shadow-map
#  vegetation, the register marker) are not there. If the screen is black with
#  "nativo" and fine with "xenos", the log to send is rex/rex_perfil.log plus
#  every "[nativo]" line: that is what says which of the two it is.
cod2_renderizador = "nativo"
